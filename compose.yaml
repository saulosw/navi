services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-navi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-navi_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-navi}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - navi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  navi-postgres:
