version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Packages that must move together are grouped so a single pull request keeps
    # the lockfile installable. Specific groups come first and win over tooling.
    groups:
      vitest:
        patterns: ['vitest', '@vitest/*']
      vite:
        patterns: ['vite', '@vitejs/*', 'electron-vite', '@vanilla-extract/vite-plugin']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      eslint:
        patterns: ['eslint', 'eslint-*', '@eslint/*', 'typescript-eslint']
      tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint refuses to load on TypeScript 7, which breaks the lint
      # step outright. Lift this once it declares support.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # @types/node majors track the Node release line, so anything above 24
      # would describe APIs the 24 LTS runtime does not have.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # electron-vite 5 peers on vite ^5 || ^6 || ^7, so neither Vite 8 nor the
      # React plugin that requires it can be installed yet.
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: '@vitejs/plugin-react'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One pull request for every action keeps the pinned SHAs consistent.
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    ignore:
      # Stay on the Node 24 LTS line: odd majors are Current releases, and the
      # root engines field rejects anything outside >=24.12 <25.
      - dependency-name: node
        update-types: [version-update:semver-major]
